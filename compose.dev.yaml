# Development and tests only, never on a server: a local S3-compatible store standing in for the real one, on :8334.
# .env.example names this file in COMPOSE_FILE, so `docker compose` runs it beside compose.yaml.
services:
  seaweedfs:
    image: chrislusf/seaweedfs
    # Small volumes: SeaweedFS only creates a volume when the disk has room for a whole one (30 GB by default).
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    ports: ["127.0.0.1:8334:8333"]
    volumes: [seaweed:/data]
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json

configs:
  s3_identities:
    content: |
      {"identities": [{"name": "ulka", "actions": ["Admin", "Read", "Write", "List", "Tagging"],
        "credentials": [{"accessKey": "${S3_ACCESS_KEY_ID:?set in .env}", "secretKey": "${S3_SECRET_ACCESS_KEY:?set in .env}"}]}]}

volumes:
  seaweed:
