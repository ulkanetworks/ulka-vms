<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ?v= makes browsers drop a cached icon; bump it when the icon changes -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.svg?v=3" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <title>Ulka VMS</title>
    <script>
      var t = null
      try { t = localStorage.getItem('stream-theme') } catch {}
      document.documentElement.classList.toggle('dark', t === 'light' || t === 'dark' ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
