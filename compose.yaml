# Every container's own log is capped: 3 files of 10 MB, then the oldest is dropped.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# What a server runs beside the program: Postgres, ClickHouse (HTTP on :8124) and the OpenTelemetry Collector (:4318).
# Videos are kept in an S3-compatible store outside (S3_*). Every port binds to 127.0.0.1: on a server a reverse proxy
# is the only way in (Docker ports skip the firewall). Development adds a local stand-in store: compose.dev.yaml.
services:
  postgres:
    logging: *logging
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    configs:
      - source: app_role
        target: /docker-entrypoint-initdb.d/app_role.sql

  clickhouse:
    logging: *logging
    restart: unless-stopped
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: ulka
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:8124:8123"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse-config/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  # OpenTelemetry: ulka-vms sends OTLP here (OTEL_EXPORTER_OTLP_ENDPOINT); it writes to ClickHouse.
  otel-collector:
    logging: *logging
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    ports: ["127.0.0.1:4318:4318"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [clickhouse]

configs:
  app_role:
    content: CREATE ROLE ulka_app LOGIN PASSWORD '${ULKA_APP_PASSWORD:?set in .env}';
volumes:
  pgdata:
  clickhouse:
