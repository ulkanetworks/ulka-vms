# Reads the origin's JSON access log and appends it to ClickHouse. Checkpoints in data_dir mean a restart
# resumes where it stopped rather than re-sending the file.
data_dir: /var/lib/vector

# Passwords come from files Docker mounts under /run/secrets, never from the config or its environment.
secret:
  files:
    type: directory
    path: /run/secrets
    remove_trailing_whitespace: true

sources:
  origin:
    type: file
    include: [/logs/origin-*.json]
    remove_after_secs: 3600 # a finished day's file, an hour after its last line

transforms:
  origin_parsed:
    type: remap
    inputs: [origin]
    drop_on_error: true # a malformed line isn't written half-parsed; it goes to origin_rejects instead
    reroute_dropped: true
    source: |
      . = parse_json!(.message)

sinks:
  origin_clickhouse:
    type: clickhouse
    inputs: [origin_parsed]
    endpoint: http://clickhouse:8123
    database: default
    table: origin_access_logs
    date_time_best_effort: true
    skip_unknown_fields: true
    # Many small batches become few parts on the server; waiting confirms each one is written.
    query_settings:
      async_insert_settings:
        enabled: true
        wait_for_processing: true
    auth:
      strategy: basic
      user: ulka
      password: "SECRET[files.clickhouse_password]"

  # Lines that couldn't be parsed, to Vector's own log, so they're seen rather than lost quietly.
  origin_rejects:
    type: console
    inputs: [origin_parsed.dropped]
    encoding:
      codec: json
