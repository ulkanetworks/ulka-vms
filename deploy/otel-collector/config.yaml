# Receives ulka-vms's traces, logs and metrics over OTLP and writes them to ClickHouse. The tables are ulka-vms's
# (deploy/clickhouse/60-otel.sql), so the exporter doesn't create them. Any other OTLP backend can be added as another
# exporter in a pipeline.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch:
    timeout: 2s
    send_batch_size: 5000

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: default
    username: ulka
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    async_insert: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
