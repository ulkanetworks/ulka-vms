name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "A security problem? Don't file it here: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include any error code the API returned.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Upload a 4K MP4\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `git describe --tags`, or the release you run.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The API or worker log lines around the problem, with secrets and viewers' details removed.
      render: text
