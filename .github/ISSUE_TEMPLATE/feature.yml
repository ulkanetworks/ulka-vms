name: Feature request
description: Something Ulka VMS should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
      description: How you picture it working. Optional; the problem matters most.
