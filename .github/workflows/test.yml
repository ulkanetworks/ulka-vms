name: Tests

# Every pull request and every push to main: build, vet, unit tests, the end-to-end suite against the same data
# services development uses (compose.yaml), the console's type check and unit tests, and a scan for committed secrets.
# A change only to docs no test reads runs nothing. CLAUDE.md, ARCHITECTURE.md and the rules files are checked by
# TestDocNames, so they always run it.
on:
  pull_request:
    paths-ignore: [README.md, SELF-HOSTING.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, LICENSE, '.github/ISSUE_TEMPLATE/**', .github/pull_request_template.md]
  push:
    branches: [main]
    paths-ignore: [README.md, SELF-HOSTING.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, LICENSE, '.github/ISSUE_TEMPLATE/**', .github/pull_request_template.md]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGER_VERSION: v3.9.3 # Shaka Packager; the README names the same

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tools the pipeline runs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp >/dev/null
          curl -fsSL -o /usr/local/bin/packager "https://github.com/shaka-project/shaka-packager/releases/download/$PACKAGER_VERSION/packager-linux-x64" && chmod 0755 /usr/local/bin/packager
          # DB-IP's free country database (CC BY 4.0), for the country rule tests; without it they skip.
          curl -fsSL "https://download.db-ip.com/free/dbip-country-lite-$(date -u +%Y-%m).mmdb.gz" | gunzip > /tmp/country.mmdb || true
      - name: Settings for this run (every value is throwaway)
        run: |
          cp .env.example .env
          for k in POSTGRES_PASSWORD ULKA_APP_PASSWORD S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY CLICKHOUSE_PASSWORD; do
            sed -i "s|^$k=.*|$k=$(openssl rand -hex 32)|" .env
          done
          sed -i "s|^SEAL_KEY=.*|SEAL_KEY=$(openssl rand -base64 32)|; s|^GEOIP_DB=.*|GEOIP_DB=/tmp/country.mmdb|" .env
      - name: Data services (compose.yaml)
        run: |
          set -a; . ./.env; set +a
          # Only what the tests use: no telemetry collector to pull.
          docker compose up -d --quiet-pull postgres seaweedfs clickhouse
          # until-loops: a failing probe is a loop condition, which bash -e leaves alone. SeaweedFS refuses a root listing, so any answer counts.
          timeout 120 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -q; do sleep 2; done'
          timeout 120 bash -c 'until curl -fs http://localhost:8124/ping >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -s -o /dev/null http://localhost:8334/; do sleep 2; done'
          docker compose exec -T postgres createdb -U postgres ulka_vms_test
      - name: Build and vet
        run: |
          set -a; . ./.env; set +a
          go build ./... && go vet ./...
      - name: Tests (unit, spec, ownership, end-to-end with the video route guard)
        run: |
          set -a; . ./.env; set +a
          set -o pipefail
          go test ./... 2>&1 | tee test.log | { grep -v '^ok ' || true; }
      - name: Service logs on failure
        if: failure()
        run: set -a; . ./.env; set +a; docker compose logs --tail 100

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Route tree and type check
        run: npm run check
      - name: Unit tests (the console's own rules)
        run: npm test

  # The main flow in a real browser: the data services, the API and a worker on this runner, Vite serving the console.
  console-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tools the pipeline runs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp >/dev/null
          curl -fsSL -o /usr/local/bin/packager "https://github.com/shaka-project/shaka-packager/releases/download/$PACKAGER_VERSION/packager-linux-x64" && chmod 0755 /usr/local/bin/packager
      - name: Settings for this run (every value is throwaway)
        run: |
          cp .env.example .env
          for k in POSTGRES_PASSWORD ULKA_APP_PASSWORD S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY CLICKHOUSE_PASSWORD; do
            sed -i "s|^$k=.*|$k=$(openssl rand -hex 32)|" .env
          done
          # The console the browser test runs is on 5174: upload and email links are built from PUBLIC_URL.
          sed -i "s|^SEAL_KEY=.*|SEAL_KEY=$(openssl rand -base64 32)|; s|^PUBLIC_URL=.*|PUBLIC_URL=http://localhost:5174|; s|^DOCS_URL=.*|DOCS_URL=http://localhost:5174|" .env
      - name: Data services, migrations, API and worker
        run: |
          set -a; . ./.env; set +a
          # The telemetry collector isn't needed.
          docker compose up -d --quiet-pull postgres seaweedfs clickhouse
          timeout 120 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -q; do sleep 2; done'
          timeout 120 bash -c 'until curl -fs http://localhost:8124/ping >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -s -o /dev/null http://localhost:8334/; do sleep 2; done'
          # The bucket, made by hand as in any S3-compatible store.
          echo "s3.bucket.create -name $S3_BUCKET" | docker compose exec -T seaweedfs weed shell
          go build -o /tmp/ulka-vms ./cmd/ulka-vms
          /tmp/ulka-vms migrate
          nohup /tmp/ulka-vms api > /tmp/api.log 2>&1 &
          nohup /tmp/ulka-vms worker > /tmp/worker.log 2>&1 &
          nohup /tmp/ulka-vms origin > /tmp/origin.log 2>&1 &
          timeout 60 bash -c 'until curl -fs -o /dev/null http://127.0.0.1:8096/v1/meta; do sleep 1; done' || { tail -40 /tmp/api.log; exit 1; }
      - name: Console page tests
        working-directory: web
        run: |
          npm ci
          set -a; . ../.env; set +a
          # The runner's own Chrome: no browser or system libraries to download.
          PLAYWRIGHT_CHANNEL=chrome npm run pages
      - name: Logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/worker.log /tmp/origin.log || true; docker compose logs --tail 50
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still in an old commit
      # The CLI, not gitleaks-action: the action needs a paid licence on organisation repos.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --verbose
